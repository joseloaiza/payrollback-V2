version: "3.8"
services:
  rabbitmq:
    image: rabbitmq:3-management # Or a specific version like rabbitmq:3.13-management
    container_name: payroll-rabbitmq
    hostname: rabbitmq_payroll
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq # Persistent data volume
  postgres:
    image: postgres:16-alpine
    container_name: payroll-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Payroll2025@
      POSTGRES_DB: dbPayroll
    ports:
      - "5434:5432" # Postgres port (avoids clashing with dev's 5433 / host's 5432)
    volumes:
      - postgres_data_test:/var/lib/postgresql/data # Persistent data volume
  redis:
    image: redis:7.2-alpine # Lightweight Redis 7
    container_name: payroll-redis
    restart: unless-stopped
    ports:
      - "6379:6379" # Expose Redis port
    command: ["redis-server", "--appendonly", "yes"]
  redis-insight: # GUI for monitoring
    image: redislabs/redisinsight:latest
    container_name: payroll-redis-insight
    ports:
      - "8001:8001" # Access UI at http://localhost:8001
    depends_on:
      - redis
    restart: unless-stopped
  payroll-worker:
    container_name: payroll-worker-test
    image: payroll-worker-test
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=test
      platforms:
        - linux/amd64
    ports:
      - 3001:3001
    env_file:
      - .env.test
    environment:
      - PROCESS_TYPE=worker
      - PORT=3001
  payroll-api:
    container_name: payroll-api-test
    image: payroll-api-test
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
      platforms:
        - linux/amd64
    env_file:
      - .env.test
    environment:
      - PROCESS_TYPE=web
      - PORT=3000
    depends_on:
      - rabbitmq
      - postgres
    ports:
      - 3000:3000
volumes:
  postgres_data_test:
  rabbitmq_data:
