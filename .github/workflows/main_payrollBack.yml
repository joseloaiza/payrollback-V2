# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - payrollBack

on:
  push:
    branches:
      - main
  workflow_dispatch:
env:
  AZURE_CONTAINER_REGISTRY: animorhpayrolldev.azurecr.io
  ACR_NAME: animorhpayrolldev
  BUILD_IMAGE_NAME: payrollbackprd
  IMAGE_NAME: payrollback-api
  CONTAINER_APP_NAME: ca-dev-payrollv2
  RESOURCE_GROUP: rg-payroll-dev
  NODE_ENV: staging

jobs:
  build:
    runs-on: 'ubuntu-latest'
    outputs:
      tag: ${{ steps.get_version.outputs.TAG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_DEPLOY }}

      - name: Log in to ACR
        run: az acr login --name $ACR_NAME

      - name: Extract version tag
        id: get_version
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          echo "TAG=$SHORT_SHA" >> $GITHUB_ENV
          echo "TAG=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker compose -f docker-compose.prod.yml build

      - name: Tag Docker image
        run: |
          docker tag $BUILD_IMAGE_NAME $ACR_NAME.azurecr.io/$IMAGE_NAME:latest
          docker tag $BUILD_IMAGE_NAME $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ env.TAG }}

      - name: Push Docker images to ACR
        run: |
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:latest
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ env.TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      TAG: ${{ needs.build.outputs.tag }}
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_DEPLOY }}

      - name: Log in to ACR
        run: az acr login --name $ACR_NAME

      - name: Debug deployment variables
        run: |
          echo "ACR: $ACR_NAME"
          echo "Image Name: $IMAGE_NAME"
          echo "Tag: $TAG"
          echo "Full Image: $ACR_NAME.azurecr.io/$IMAGE_NAME:$TAG"

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name $CONTAINER_APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/$IMAGE_NAME:$TAG
