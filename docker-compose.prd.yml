services:
  rabbitmq:
    image: rabbitmq:3-management # Or a specific version like rabbitmq:3.13-management
    container_name: payroll-rabbitmq
    hostname: rabbitmq_payroll
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
  redis:
    image: redis:7.2-alpine # Lightweight Redis 7
    container_name: payroll-redis
    restart: unless-stopped
    ports:
      - "6379:6379" # Expose Redis port
    command: ["redis-server", "--appendonly", "yes"]
  redis-insight: # GUI for monitoring
    image: redislabs/redisinsight:latest
    container_name: payroll-redis-insight
    ports:
      - "8001:8001" # Access UI at http://localhost:8001
    depends_on:
      - redis
    restart: unless-stopped
  payroll-worker:
    container_name: payroll-worker-prd
    image: payroll-worker-prd
    build:
      context: ./payroll-worker
      args:
        - NODE_ENV=production
      platforms:
        - linux/amd64
    ports:
      - 3001:3001
    env_file:
      - ./payroll-worker/.env.production
  payroll-api:
    container_name: payroll-api-prd
    image: payroll-api-prd
    build:
      context: ./payrollback
      args:
        - NODE_ENV=production
      platforms:
        - linux/amd64
    env_file:
      - ./payrollback/.env.production
    depends_on:
      - rabbitmq
    ports:
      - 3000:3000
